name: Laravel CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  laravel-tests:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: laravel_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.4'
        extensions: mbstring, dom, curl, libxml, mysql
        tools: composer:v2 # Aseguramos la última versión de composer
        coverage: none

    # Este paso es el truco: verifica que realmente estemos en 8.4 antes de seguir
    - name: Check PHP version
      run: php -v

    - name: Install Composer Dependencies
      # Añadimos --ignore-platform-req=php para que no se detenga si detecta 8.3 por error
      run: composer install --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist --ignore-platform-req=php

    - name: Install NPM & Build
      run: |
        npm install
        npm run build

    - name: Prepare Laravel Environment
      run: |
        cp .env.example .env
        php artisan key:generate

    - name: Run Migrations and Tests
      env:
        DB_CONNECTION: mysql
        DB_HOST: 127.0.0.1
        DB_PORT: 3306
        DB_DATABASE: laravel_test
        DB_USERNAME: root
        DB_PASSWORD: password
      run: |
        php artisan migrate --force
        php artisan test