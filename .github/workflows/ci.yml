name: Laravel CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  laravel-tests:
    runs-on: ubuntu-latest

    # 1. SET DE LA BASE DE DATOS (Servicio)
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: password  # <-- Definimos la clave del motor
          MYSQL_DATABASE: laravel_test   # <-- Creamos la DB
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # 2. SET DE PHP (Versión 8.5)
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.5' 
        extensions: mbstring, dom, curl, libxml, mysql
        coverage: none

    - name: Install Composer Dependencies
      run: composer install --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

    - name: Install NPM & Build
      run: |
        npm install
        npm run build

    - name: Prepare Laravel Environment
      run: |
        cp .env.example .env
        php artisan key:generate

    # 3. SET DE CONEXIÓN PARA LOS TESTS
    # Aquí es donde le decimos a Laravel cómo conectarse al MySQL de arriba
    - name: Run Migrations and Tests
      env:
        DB_CONNECTION: mysql
        DB_HOST: 127.0.0.1
        DB_PORT: 3306
        DB_DATABASE: laravel_test
        DB_USERNAME: root
        DB_PASSWORD: password  # <-- Debe coincidir con el root password de arriba
      run: |
        php artisan migrate --force
        php artisan test